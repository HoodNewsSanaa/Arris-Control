name: Build Android APK
on:
  push:
    branches: [main, 'codex/android']
    paths:
      - 'Android/**'
      - 'Tests/**'
      - '*.cs'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'Android/**'
      - 'Tests/**'
      - '*.cs'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Build Windows app and run original packaged regressions
        shell: pwsh
        run: ./build.ps1
  apk:
    needs: windows-regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Refuse private SURFboard references in public builds
        run: |
          if git ls-files --error-unmatch Android/protocol.local.json >/dev/null 2>&1 || [ -e Android/protocol.local.json ]; then
            echo "::error title=Private reference::Android/protocol.local.json must never be committed or built in CI."
            exit 1
          fi
      - name: Offline shared protocol tests
        run: dotnet run --project Tests/Arris-Control.Tests.csproj -c Release
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build standalone installable APK
        run: >-
          dotnet publish Android/Arris-Control.Android.csproj -c Release
          -p:AndroidPackageFormats=apk -p:AndroidKeyStore=false
          -p:ApplicationVersion=${{ github.run_number }} -o artifacts
      - name: Collect APK and checksum
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          files = list(Path('artifacts').glob('*-Signed.apk'))
          if len(files) != 1:
              raise SystemExit(f'Expected one universal signed APK, found {len(files)}')
          target = Path('artifacts/Arris-Control-android.apk')
          files[0].replace(target)
          Path('artifacts/SHA256SUMS-android.txt').write_text(hashlib.sha256(target.read_bytes()).hexdigest() + '  ' + target.name + '\n')
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android launch and Keystore smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 Android/smoke-test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Arris-Control-Android
          path: |
            artifacts/Arris-Control-android.apk
            artifacts/SHA256SUMS-android.txt
            artifacts/Android-UI-preview.png
            artifacts/android-smoke.log
          if-no-files-found: error
          retention-days: 90
      - name: Publish Android preview download
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create android-preview-${{ github.run_number }}
          artifacts/Arris-Control-android.apk artifacts/SHA256SUMS-android.txt artifacts/Android-UI-preview.png
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Arris Control Android preview ${{ github.run_number }}"
          --notes-file Android/RELEASE-NOTES.md --prerelease --latest=false
